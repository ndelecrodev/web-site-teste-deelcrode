<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Quimia admin panel architecture"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0e11"/><stop offset="1" stop-color="#17181c"/></linearGradient><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 8 4.5 1 8z" fill="#fb6c2b"/></marker></defs><style>.flow{stroke-dasharray:5 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.flow,.lit{animation:none}}</style><rect width="960" height="430" rx="14" fill="url(#bg)"/><g font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif"><rect x="35" y="40" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#3b3d44" stroke-width="1.4"/><text x="53" y="71" font-size="14.5" font-weight="700" fill="#f4f4f6">Browser</text><text x="53" y="96" font-size="12.2" fill="#a8abb3">Server-rendered pages</text><text x="53" y="113" font-size="12.2" fill="#a8abb3">(Thymeleaf), 11 screens</text><rect x="265" y="40" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#3b3d44" stroke-width="1.4"/><text x="283" y="71" font-size="14.5" font-weight="700" fill="#f4f4f6">Spring Security</text><text x="283" y="96" font-size="12.2" fill="#a8abb3">Argon2id login</text><text x="283" y="113" font-size="12.2" fill="#a8abb3">5 failures lock 15 min</text><text x="283" y="130" font-size="12.2" fill="#a8abb3">CSRF and CSP</text><rect x="495" y="40" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#3b3d44" stroke-width="1.4"/><text x="513" y="71" font-size="14.5" font-weight="700" fill="#f4f4f6">Controllers</text><text x="513" y="96" font-size="12.2" fill="#a8abb3">GenericController and</text><text x="513" y="113" font-size="12.2" fill="#a8abb3">ListController across</text><text x="513" y="130" font-size="12.2" fill="#a8abb3">all screens</text><rect x="725" y="40" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#3b3d44" stroke-width="1.4"/><text x="743" y="71" font-size="14.5" font-weight="700" fill="#f4f4f6">Services</text><text x="743" y="96" font-size="12.2" fill="#a8abb3">CrudService, removal and</text><text x="743" y="113" font-size="12.2" fill="#a8abb3">restore in one transaction</text><text x="743" y="130" font-size="12.2" fill="#a8abb3">validated photo upload</text><path class="flow" d="M237 99.0 L261 99.0" stroke="#fb6c2b" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path class="flow" d="M467 99.0 L491 99.0" stroke="#fb6c2b" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path class="flow" d="M697 99.0 L721 99.0" stroke="#fb6c2b" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><rect x="725" y="230" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#3b3d44" stroke-width="1.4"/><text x="743" y="261" font-size="14.5" font-weight="700" fill="#f4f4f6">Repositories</text><text x="743" y="286" font-size="12.2" fill="#a8abb3">Spring Data JPA/Hibernate</text><text x="743" y="303" font-size="12.2" fill="#a8abb3">validate: the database</text><text x="743" y="320" font-size="12.2" fill="#a8abb3">owns the schema</text><path class="flow" d="M825.0 160 L825.0 226" stroke="#fb6c2b" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><rect x="495" y="230" width="200" height="132" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#fb6c2b" stroke-width="1.4"/><text x="513" y="261" font-size="14.5" font-weight="700" fill="#f4f4f6">PostgreSQL (Aiven)</text><text x="513" y="286" font-size="12.2" fill="#a8abb3">App tables</text><text x="513" y="303" font-size="12.2" fill="#a8abb3">admin_log_edicoes</text><text x="513" y="320" font-size="12.2" fill="#a8abb3">(audit trail and restore)</text><text x="513" y="337" font-size="12.2" fill="#a8abb3">mv_dashboard (mat. view)</text><path class="flow" d="M723 289.0 L699 289.0" stroke="#fb6c2b" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><rect x="265" y="230" width="200" height="86" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#3b3d44" stroke-width="1.4"/><text x="283" y="261" font-size="14.5" font-weight="700" fill="#f4f4f6">GitHub Actions</text><text x="283" y="286" font-size="12.2" fill="#a8abb3">Refreshes mv_dashboard</text><text x="283" y="303" font-size="12.2" fill="#a8abb3">every 2 hours</text><path class="flow" d="M467 273 L491 273" stroke="#fb6c2b" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><text x="35" y="404" font-size="12.5" fill="#a8abb3" text-anchor="start" font-weight="400" letter-spacing="0">Every change made through the UI becomes an audit record, with the responsible admin and the previous data.</text></g></svg>